# poudriere.conf for the keelNAS package set; tools/pkgrepo/build.sh installs it with the
# @ZFS@ and @KEY@ lines filled in.
@ZFS@
BASEFS=/usr/local/poudriere
FREEBSD_HOST=https://download.FreeBSD.org
RESOLV_CONF=/etc/resolv.conf
DISTFILES_CACHE=/usr/local/poudriere/distfiles
# wrkdirs on disk: samba and icu in tmpfs next to each other do not fit a small builder's memory
USE_TMPFS=data
PARALLEL_JOBS=4
ALLOW_MAKE_JOBS=yes
CHECK_CHANGED_OPTIONS=verbose
CHECK_CHANGED_DEPS=yes
PKG_REPO_SIGNING_KEY=@KEY@
URL_BASE=
